  <circle cx="274" cy="278" r="156" fill="#1B1410"/>
  <circle cx="256" cy="256" r="156" fill="#4C8DF6"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="5">
    <ellipse cx="256" cy="256" rx="70" ry="156"/>
    <path d="M100 256h312M120 180h272M120 332h272"/>
  </g>
  <!-- Terres (crème) -->
  <path d="M130 196c22-34 64-50 104-46 14 22 6 46-14 58-6 30-34 40-60 30-14-12-24-24-30-42z" fill="#FFF6E5" stroke="#1B1410" stroke-width="7" stroke-linejoin="round"/>
  <path d="M168 300c26-8 50 4 58 28-2 30-20 56-42 66-18-24-26-60-16-94z" fill="#FFF6E5" stroke="#1B1410" stroke-width="7" stroke-linejoin="round"/>
