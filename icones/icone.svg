<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de l'application : le globe de l'accueil, style « affiche » (fond menthe, contour à l'encre, ombre dure).
       Le dessin tient dans le cercle central de 80 % : il convient aussi aux icônes « maskable » d'Android. -->
